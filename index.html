<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Currency Calculator</title>
<meta name="description" content="Live currency converter with real-time exchange rates." />
<style>
  :root {
    --bg: #0b0f19;
    --card: #121826;
    --card-border: #1f2937;
    --text: #e5e9f0;
    --text-dim: #8b94a7;
    --accent: #5b7fff;
    --accent-hover: #7593ff;
    --danger: #ff6b6b;
    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 20% 0%, rgba(91, 127, 255, 0.12), transparent 45%),
                       radial-gradient(circle at 90% 100%, rgba(91, 127, 255, 0.08), transparent 45%);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  main.card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 1.5rem;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.875rem;
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input[type="number"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.4rem;
    font-weight: 600;
    color: var(--text);
    background: #0e1420;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91, 127, 255, 0.25);
  }

  .currency-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 10px;
  }

  select {
    width: 100%;
    padding: 14px 12px;
    font-size: 1rem;
    color: var(--text);
    background: #0e1420;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    outline: none;
    appearance: none;
    cursor: pointer;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91, 127, 255, 0.25);
  }

  .swap-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--card-border);
    background: #0e1420;
    color: var(--accent);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.15s ease, border-color 0.15s ease;
    margin: 0 auto;
  }

  .swap-btn:hover {
    background: #16203a;
    border-color: var(--accent);
  }

  .swap-btn:active {
    transform: rotate(180deg);
  }

  .result {
    margin-top: 24px;
    padding: 20px;
    border-radius: 14px;
    background: linear-gradient(160deg, rgba(91, 127, 255, 0.12), rgba(91, 127, 255, 0.02));
    border: 1px solid rgba(91, 127, 255, 0.25);
    text-align: center;
    min-height: 96px;
    position: relative;
  }

  .result .amount {
    font-size: 2rem;
    font-weight: 700;
    color: #fff;
    word-break: break-word;
  }

  .result .rate {
    margin-top: 6px;
    font-size: 0.9rem;
    color: var(--text-dim);
  }

  .result .updated {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--text-dim);
    opacity: 0.8;
  }

  .status {
    margin-top: 14px;
    text-align: center;
    font-size: 0.85rem;
    min-height: 20px;
  }

  .status.error {
    color: var(--danger);
  }

  .spinner {
    display: inline-block;
    width: 18px;
    height: 18px;
    border: 2px solid rgba(91, 127, 255, 0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  .loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(18, 24, 38, 0.6);
    border-radius: 14px;
    backdrop-filter: blur(2px);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  footer {
    margin-top: 22px;
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  @media (max-width: 400px) {
    .currency-row {
      grid-template-columns: 1fr;
    }
    .swap-btn {
      transform: rotate(90deg);
    }
    .swap-btn:active {
      transform: rotate(270deg);
    }
  }
</style>
</head>
<body>
  <main class="card">
    <header>
      <h1>Currency Calculator</h1>
      <p>Live exchange rates, updated in real time</p>
    </header>

    <div class="field">
      <label for="amount">Amount</label>
      <input type="number" id="amount" value="1" min="0" step="any" inputmode="decimal" />
    </div>

    <div class="field">
      <div class="currency-row">
        <div>
          <label for="from-currency">From</label>
          <select id="from-currency"></select>
        </div>
        <button type="button" class="swap-btn" id="swap-btn" title="Swap currencies" aria-label="Swap currencies">&#8646;</button>
        <div>
          <label for="to-currency">To</label>
          <select id="to-currency"></select>
        </div>
      </div>
    </div>

    <section class="result" id="result">
      <div class="amount" id="result-amount">&mdash;</div>
      <div class="rate" id="result-rate"></div>
      <div class="updated" id="result-updated"></div>
      <div class="loading-overlay" id="loading-overlay" hidden>
        <span class="spinner"></span> Fetching rates&hellip;
      </div>
    </section>

    <div class="status" id="status"></div>

    <footer>Rates provided by open.er-api.com</footer>
  </main>

<script>
(() => {
  const CURRENCIES = [
    ["USD", "US Dollar"],
    ["EUR", "Euro"],
    ["GBP", "British Pound"],
    ["JPY", "Japanese Yen"],
    ["INR", "Indian Rupee"],
    ["CAD", "Canadian Dollar"],
    ["AUD", "Australian Dollar"],
    ["CHF", "Swiss Franc"],
    ["CNY", "Chinese Yuan"],
    ["NZD", "New Zealand Dollar"],
    ["SGD", "Singapore Dollar"],
    ["ZAR", "South African Rand"],
    ["BRL", "Brazilian Real"],
    ["MXN", "Mexican Peso"],
    ["AED", "UAE Dirham"],
  ];

  const amountInput = document.getElementById("amount");
  const fromSelect = document.getElementById("from-currency");
  const toSelect = document.getElementById("to-currency");
  const swapBtn = document.getElementById("swap-btn");
  const resultAmount = document.getElementById("result-amount");
  const resultRate = document.getElementById("result-rate");
  const resultUpdated = document.getElementById("result-updated");
  const statusEl = document.getElementById("status");
  const loadingOverlay = document.getElementById("loading-overlay");

  const rateCache = new Map();
  let currentRates = null;
  let currentBase = null;
  let currentUpdatedUtc = null;
  let fetchController = null;

  function populateSelects() {
    for (const [code, name] of CURRENCIES) {
      const optionFrom = document.createElement("option");
      optionFrom.value = code;
      optionFrom.textContent = `${code} — ${name}`;
      fromSelect.appendChild(optionFrom);

      const optionTo = document.createElement("option");
      optionTo.value = code;
      optionTo.textContent = `${code} — ${name}`;
      toSelect.appendChild(optionTo);
    }
    fromSelect.value = "USD";
    toSelect.value = "EUR";
  }

  function setLoading(isLoading) {
    loadingOverlay.hidden = !isLoading;
  }

  function setStatus(message, isError = false) {
    statusEl.textContent = message;
    statusEl.classList.toggle("error", isError);
  }

  async function fetchRates(base) {
    if (rateCache.has(base)) {
      return rateCache.get(base);
    }

    if (fetchController) {
      fetchController.abort();
    }
    fetchController = new AbortController();

    const response = await fetch(`https://open.er-api.com/v6/latest/${base}`, {
      signal: fetchController.signal,
    });

    if (!response.ok) {
      throw new Error(`Request failed with status ${response.status}`);
    }

    const data = await response.json();

    if (data.result !== "success") {
      throw new Error("Exchange rate provider returned an error");
    }

    const payload = {
      rates: data.rates,
      updatedUtc: data.time_last_update_utc,
    };
    rateCache.set(base, payload);
    return payload;
  }

  function formatUpdatedTimestamp(rawUtcString) {
    if (!rawUtcString) return "";
    const date = new Date(rawUtcString);
    if (Number.isNaN(date.getTime())) return rawUtcString;
    return `Last updated: ${date.toUTCString()}`;
  }

  function renderResult() {
    const amount = parseFloat(amountInput.value);
    const from = fromSelect.value;
    const to = toSelect.value;

    if (!currentRates || currentBase !== from) {
      return;
    }

    const rate = to === from ? 1 : currentRates[to];

    if (rate === undefined) {
      setStatus(`No rate available for ${to}`, true);
      resultAmount.textContent = "—";
      resultRate.textContent = "";
      return;
    }

    if (Number.isNaN(amount) || amount < 0) {
      resultAmount.textContent = "—";
      resultRate.textContent = "";
      return;
    }

    const converted = amount * rate;
    const formatted = new Intl.NumberFormat(undefined, {
      style: "currency",
      currency: to,
      maximumFractionDigits: 4,
    }).format(converted);

    resultAmount.textContent = formatted;
    resultRate.textContent = `1 ${from} = ${rate.toFixed(6).replace(/0+$/, "").replace(/\.$/, "")} ${to}`;
    resultUpdated.textContent = formatUpdatedTimestamp(currentUpdatedUtc);
    setStatus("");
  }

  async function loadAndRender() {
    const from = fromSelect.value;
    setLoading(true);
    setStatus("");

    try {
      const { rates, updatedUtc } = await fetchRates(from);
      currentRates = rates;
      currentBase = from;
      currentUpdatedUtc = updatedUtc;
      renderResult();
    } catch (err) {
      if (err.name === "AbortError") return;
      setStatus("Could not fetch exchange rates. Please try again.", true);
      resultAmount.textContent = "—";
      resultRate.textContent = "";
    } finally {
      setLoading(false);
    }
  }

  function swapCurrencies() {
    const from = fromSelect.value;
    const to = toSelect.value;
    fromSelect.value = to;
    toSelect.value = from;
    loadAndRender();
  }

  amountInput.addEventListener("input", renderResult);
  toSelect.addEventListener("change", renderResult);
  fromSelect.addEventListener("change", loadAndRender);
  swapBtn.addEventListener("click", swapCurrencies);

  populateSelects();
  loadAndRender();
})();
</script>
</body>
</html>
